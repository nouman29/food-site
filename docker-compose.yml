services:
  # Production: docker compose up -d --build
  web:
    build:
      context: .
      target: runtime
    image: habibi-web:latest
    container_name: habibi-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Development with hot reload: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true   # reliable file watching on Windows/macOS
    volumes:
      - .:/app
      - node_modules:/app/node_modules   # keep container's deps, don't use host's

volumes:
  node_modules:
