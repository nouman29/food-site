# Name shown in the GitHub "Actions" tab
name: CI

# ---------- WHEN does this workflow run? ----------
on:
  push:
    branches: [main]        # every push to main
  pull_request:
    branches: [main]        # every PR that targets main
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab (manual run)

# Cancel an older run if you push again to the same branch before it finishes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the repo
permissions:
  contents: read

# ---------- WHAT does it do? ----------
jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest    # a fresh Linux VM, provided free by GitHub
    timeout-minutes: 10

    steps:
      # 1. Download your repo's code onto the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node 22 (same version as the Dockerfile) and cache ~/.npm
      #    keyed on package-lock.json, so repeat runs install much faster
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Clean, reproducible install exactly from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Fail the pipeline if ESLint finds errors
      - name: Lint
        run: npm run lint

      # 5. Fail the pipeline if the production build breaks
      - name: Build
        run: npm run build

      # 6. Save the built site (dist/) so you can download it from the run page
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
