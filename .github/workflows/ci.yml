# Name shown in the GitHub "Actions" tab
name: CI

# ---------- WHEN does this workflow run? ----------
on:
  push:
    branches: [main]        # every push to main
  pull_request:
    branches: [main]        # every PR that targets main
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab (manual run)

# Cancel an older run if you push again to the same branch before it finishes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the repo
permissions:
  contents: read

# ---------- WHAT does it do? ----------
jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest    # a fresh Linux VM, provided free by GitHub
    timeout-minutes: 10

    steps:
      # 1. Download your repo's code onto the VM
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Install Node 24 LTS (same version as the Dockerfile) and cache ~/.npm
      #    keyed on package-lock.json, so repeat runs install much faster
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 3. Clean, reproducible install exactly from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Fail the pipeline if ESLint finds errors
      - name: Lint
        run: npm run lint

      # 5. Fail the pipeline if the production build breaks
      - name: Build
        run: npm run build

      # 6. Save the built site (dist/) so you can download it from the run page
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ---------- LEVEL 2: build the Docker image and smoke-test it ----------
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-build       # only runs if the job above passed
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Buildx is Docker's modern builder; needed for layer caching below
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the "runtime" stage of the Dockerfile.
      # load: true   -> put the image into the runner's local Docker so we can `docker run` it
      # push: false  -> don't publish anywhere yet (that's Level 3)
      # cache-*: gha -> reuse unchanged layers from previous runs via GitHub's cache
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: habibi-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the container with the same hardening as docker-compose.yml
      - name: Run container
        run: |
          docker run -d --name web -p 8080:8080 \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            habibi-web:ci

      # Wait for Docker's own HEALTHCHECK (defined in the Dockerfile) to report "healthy"
      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web)
            echo "Attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Container never became healthy"; exit 1

      # The actual smoke tests: does the site respond like we expect?
      - name: Smoke test
        run: |
          set -e
          echo "-> /healthz returns ok"
          curl -fsS http://localhost:8080/healthz | grep -q ok

          echo "-> home page serves the React app"
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'

          echo "-> unknown routes fall back to index.html (SPA routing)"
          curl -fsS http://localhost:8080/some/client/route | grep -q '<div id="root">'

          echo "-> security header is present"
          curl -fsSI http://localhost:8080/ | grep -qi 'x-content-type-options: nosniff'

          echo "-> missing files return a real 404 (not index.html)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope.js)" = 404

          echo "-> hashed assets are cached for a year, with one Cache-Control header"
          asset=$(curl -fsS http://localhost:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          headers=$(curl -fsSI "http://localhost:8080$asset")
          echo "$headers" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$(echo "$headers" | grep -ci '^cache-control:')" = 1

          echo "All smoke tests passed"

      # If anything failed, print the container logs so you can debug from the run page
      - name: Show container logs
        if: failure()
        run: docker logs web

      # Always clean up, pass or fail
      - name: Stop container
        if: always()
        run: docker rm -f web

  # ---------- LEVEL 3: publish the image to GitHub Container Registry ----------
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: docker               # only publish an image that passed the smoke test
    # Only on a real push to main -- never for pull requests (untrusted code)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    # This job (only) gets permission to push packages, using the built-in GITHUB_TOKEN.
    # No secrets to create: GitHub generates this token for every run.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out image tags + standard OCI labels (which link the package to this repo)
      #   sha-<7 chars>  -> exact, immutable version you can roll back to
      #   latest         -> always the newest build of main
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      # Same build as the docker job; the gha cache makes this almost instant
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          # Intel/AMD servers + Apple Silicon Macs / AWS Graviton.
          # No QEMU needed: the runtime stage only COPYs files (no RUN).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- LEVEL 4: deploy the new image to the EC2 server ----------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    # A GitHub "environment": groups the deploy secrets, records every deployment
    # on the repo page, and is where you can add manual-approval rules later
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}

    # Never run two deploys at the same time; queue them instead of cancelling
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read            # lets GITHUB_TOKEN pull the image on the server

    env:
      SSH: ssh -i ~/.ssh/deploy_key ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}

    steps:
      # Write the private key and the server's fingerprint from secrets.
      # Pinning known_hosts means we refuse to talk to an impostor server.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Deploy the exact image this commit produced (not "latest"), so every
      # deploy is traceable and rolling back = re-running an older workflow.
      # metadata-action's sha tag uses the short (7 char) commit hash.
      - name: Work out image tag
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Pull the new image and swap containers. If the new one doesn't become
      # healthy, put the previous version back and fail the job (auto-rollback).
      - name: Deploy
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH "IMAGE=$IMAGE bash -s" <<'REMOTE'
          set -euo pipefail

          run() {
            docker run -d --name habibi-web --restart unless-stopped \
              -p 80:8080 --read-only --tmpfs /tmp \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --memory 128m --cpus 0.5 \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$1"
          }
          wait_healthy() {
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' habibi-web)" = healthy ] && return 0
              sleep 2
            done
            return 1
          }

          docker pull "$IMAGE"
          docker logout ghcr.io
          PREV=$(docker inspect -f '{{.Config.Image}}' habibi-web 2>/dev/null || true)
          echo "Current: ${PREV:-none}  ->  New: $IMAGE"

          docker rm -f habibi-web >/dev/null 2>&1 || true
          run "$IMAGE"

          if wait_healthy; then
            echo "Deployed $IMAGE"
            docker image prune -f >/dev/null       # remove dangling layers
          else
            echo "::error::New container is unhealthy -- rolling back"
            docker logs --tail 50 habibi-web || true
            docker rm -f habibi-web
            [ -n "$PREV" ] && run "$PREV" && wait_healthy && echo "Rolled back to $PREV"
            exit 1
          fi
          REMOTE

      # Final check from the outside world, through the real public IP
      - name: Verify live site
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors http://${{ vars.EC2_HOST }}/healthz
          curl -fsS http://${{ vars.EC2_HOST }}/ | grep -q '<div id="root">'
          echo "Live at http://${{ vars.EC2_HOST }}"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
