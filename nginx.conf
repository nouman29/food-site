server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite emits content-hashed files in /assets -> cache forever.
    # ^~ = if this prefix matches, skip the regex locations below
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Anything that looks like a file (has an extension) must exist -> real 404,
    # instead of silently serving index.html for a broken script/image path
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # index.html must never be cached so new deploys show up immediately.
    # Any add_header here cancels the server-level ones, so repeat them;
    # every HTML page (/, SPA routes) is served through this block.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA fallback for react-router-dom client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
